    <path d="M8 200 L92 200 L96 352 L4 352 Z" fill="url(#veshtiCream)" stroke="#C59B27" stroke-width="2" />
    <rect x="46" y="200" width="8" height="152" fill="url(#goldFrame)" />
    <rect x="4" y="326" width="92" height="26" fill="url(#goldFrame)" />
    <rect x="4" y="320" width="92" height="4" fill="#7A1C1C" />

    <!-- Royal Golden Angavastram (Towel over shoulder) -->
    <path d="M18 90 L38 88 L42 235 L16 235 Z" fill="url(#goldFrame)" stroke="#9A721C" stroke-width="1.5" />
    <rect x="16" y="218" width="26" height="8" fill="#7A1C1C" />

    <!-- Folded Hands in Vanakkam -->
    <path d="M12 108 C4 142, 24 162, 45 154" stroke="url(#veshtiCream)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M88 108 C96 142, 76 162, 55 154" stroke="url(#veshtiCream)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M50 124 C42 134, 42 154, 50 158 C58 154, 58 134, 50 124 Z" fill="url(#skinTone)" stroke="#B57347" stroke-width="1.2" />
  </g>

  <!-- ============================================================ -->
