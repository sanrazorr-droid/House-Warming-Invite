    <!-- Hair -->
    <path d="M26 36 C24 14, 76 14, 74 36 C70 26, 30 26, 26 36 Z" fill="#1F1715" />
    <!-- Neck -->
    <rect x="41" y="76" width="18" height="18" rx="6" fill="url(#skinTone)" />
    <!-- Face -->
    <ellipse cx="50" cy="50" rx="23" ry="27" fill="url(#skinTone)" />
    <!-- Vibhuthi & Kumkum on Forehead -->
    <line x1="41" y1="35" x2="59" y2="35" stroke="#FFFDF8" stroke-width="2.2" stroke-linecap="round" />
    <line x1="43" y1="38" x2="57" y2="38" stroke="#FFFDF8" stroke-width="2" stroke-linecap="round" />
    <circle cx="50" cy="37" r="2.5" fill="#9E1B1B" />
    <!-- Eyes, Mustache & Warm Smile -->
    <path d="M36 45 Q41 41 46 45" stroke="#1E1410" stroke-width="2" stroke-linecap="round" />
    <path d="M54 45 Q59 41 64 45" stroke="#1E1410" stroke-width="2" stroke-linecap="round" />
    <circle cx="41" cy="49" r="2.3" fill="#1E1410" />
    <circle cx="59" cy="49" r="2.3" fill="#1E1410" />
    <path d="M39 60 Q50 56 61 60" stroke="#1E1410" stroke-width="3" stroke-linecap="round" />
