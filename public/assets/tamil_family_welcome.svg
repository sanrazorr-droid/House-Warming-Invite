    <circle cx="28" cy="56" r="4" fill="#D4AF37" />
    <path d="M24 60 L32 60 L30 66 L26 66 Z" fill="#B3861B" />
    <circle cx="72" cy="56" r="4" fill="#D4AF37" />
    <path d="M68 60 L76 60 L74 66 L70 66 Z" fill="#B3861B" />

    <!-- Silk Pattu Pavadai & Emerald/Pink Dhavani (Half-Saree) -->
    <path d="M18 96 C26 86, 74 86, 82 96 L94 175 L6 175 Z" fill="url(#emeraldSilk)" stroke="#D4AF37" stroke-width="2" />
    <!-- Long Pattu Skirt -->
    <path d="M14 170 L86 170 L98 312 L2 312 Z" fill="url(#royalPinkSilk)" stroke="#D4AF37" stroke-width="2.5" />
    <!-- Gold Zari Border at bottom of skirt -->
    <rect x="3" y="286" width="94" height="26" fill="url(#goldFrame)" />
    <!-- Diagonal Silk Dhavani Drape -->
    <path d="M24 92 L78 168 L22 225 L14 140 Z" fill="url(#goldFrame)" fill-opacity="0.88" stroke="#9A721C" stroke-width="1.5" />
    <!-- Gold Necklace / Kasu Malai -->
    <path d="M36 88 Q50 105 64 88" stroke="#F7E4A3" stroke-width="4" stroke-linecap="round" />
    <path d="M32 92 Q50 116 68 92" stroke="#D4AF37" stroke-width="3" stroke-dasharray="3 3" />

    <!-- Folded Hands in Vanakkam (Namaste) -->
    <path d="M18 105 C10 132, 26 150, 46 144" stroke="url(#skinTone)" stroke-width="11" stroke-linecap="round" fill="none" />
    <path d="M82 105 C90 132, 74 150, 54 144" stroke="url(#skinTone)" stroke-width="11" stroke-linecap="round" fill="none" />
    <!-- Joined Palms at chest -->
    <path d="M50 118 C43 126, 43 144, 50 148 C57 144, 57 126, 50 118 Z" fill="url(#skinTone)" stroke="#B57347" stroke-width="1" />
