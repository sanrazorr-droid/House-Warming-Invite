    <rect x="43" y="162" width="6" height="112" fill="url(#goldFrame)" />
    <rect x="8" y="252" width="76" height="22" fill="url(#goldFrame)" />
    <rect x="8" y="248" width="76" height="3" fill="#7A1C1C" />

    <!-- Folded Hands in Vanakkam -->
    <path d="M16 90 C10 116, 24 132, 42 126" stroke="url(#skinTone)" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M76 90 C82 116, 68 132, 50 126" stroke="url(#skinTone)" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M46 102 C40 110, 40 126, 46 130 C52 126, 52 110, 46 102 Z" fill="url(#skinTone)" stroke="#B57347" stroke-width="1" />
  </g>

  <!-- Glowing Brass Kuthuvilakku Lamps Flanking the Family -->
  <g transform="translate(86, 355)">
    <circle cx="24" cy="16" r="18" fill="#F59E0B" fill-opacity="0.28" />
    <path d="M24 2 C18 12, 17 20, 24 25 C31 20, 30 12, 24 2 Z" fill="#F59E0B" />
    <path d="M24 8 C21 14, 21 19, 24 23 C27 19, 27 14, 24 8 Z" fill="#FEF08A" />
    <path d="M8 26 L40 26 L34 35 L14 35 Z" fill="url(#goldFrame)" stroke="#8A6112" stroke-width="1.2" />
    <rect x="20" y="35" width="8" height="75" rx="3" fill="url(#goldFrame)" />
    <path d="M8 122 C12 108, 36 108, 40 122 Z" fill="url(#goldFrame)" stroke="#8A6112" stroke-width="1.2" />
    <rect x="4" y="122" width="40" height="6" rx="3" fill="#9A721C" />
