    <!-- Auspicious Maroon Kungumam & Manjal -->
    <circle cx="50" cy="39" r="3.2" fill="#8E1616" />
    <circle cx="50" cy="44" r="1.5" fill="#F59E0B" />
    <!-- Eyes, Nose Ring (Mookuthi) & Warm Smile -->
    <path d="M36 45 Q41 41 46 45" stroke="#1E1410" stroke-width="1.8" stroke-linecap="round" />
    <path d="M54 45 Q59 41 64 45" stroke="#1E1410" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="41" cy="49" r="2.2" fill="#1E1410" />
    <circle cx="59" cy="49" r="2.2" fill="#1E1410" />
    <circle cx="46" cy="55" r="1.5" fill="#FFFDF8" />
