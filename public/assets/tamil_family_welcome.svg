<svg width="800" height="540" viewBox="0 0 800 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCream" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="55%" stop-color="#FAF0D8" />
      <stop offset="100%" stop-color="#F2DFB6" />
    </linearGradient>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="800" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7E4A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A721C" />
    </linearGradient>
    <linearGradient id="maroonSilk" x1="0" y1="150" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9E2424" />
      <stop offset="60%" stop-color="#7A1616" />
      <stop offset="100%" stop-color="#520D0D" />
    </linearGradient>
    <linearGradient id="emeraldSilk" x1="0" y1="200" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7D5B" />
      <stop offset="100%" stop-color="#1B4D36" />
    </linearGradient>
    <linearGradient id="royalPinkSilk" x1="0" y1="200" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D84B73" />
      <stop offset="100%" stop-color="#8E1C42" />
    </linearGradient>
    <linearGradient id="veshtiCream" x1="0" y1="180" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F3E5C2" />
    </linearGradient>
    <linearGradient id="skinTone" x1="0" y1="150" x2="0" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2A97E" />
      <stop offset="100%" stop-color="#C9885B" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#F6E3A5" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FAF0D8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="540" rx="28" fill="url(#bgCream)" />
  <circle cx="400" cy="260" r="260" fill="url(#haloGlow)" />

  <!-- Ornate Golden Mandapam Border & Temple Arch -->
  <rect x="14" y="14" width="772" height="512" rx="22" stroke="url(#goldFrame)" stroke-width="4" />
  <rect x="24" y="24" width="752" height="492" rx="16" stroke="#C59B27" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Carved Temple Pillars Left & Right -->
  <g opacity="0.9">
    <rect x="38" y="65" width="32" height="425" fill="url(#goldFrame)" stroke="#8A6112" stroke-width="1.5" />
    <rect x="30" y="60" width="48" height="16" rx="4" fill="#D4AF37" stroke="#8A6112" stroke-width="1.5" />
    <rect x="28" y="476" width="52" height="20" rx="4" fill="#D4AF37" stroke="#8A6112" stroke-width="1.5" />

    <rect x="730" y="65" width="32" height="425" fill="url(#goldFrame)" stroke="#8A6112" stroke-width="1.5" />
    <rect x="722" y="60" width="48" height="16" rx="4" fill="#D4AF37" stroke="#8A6112" stroke-width="1.5" />
    <rect x="720" y="476" width="52" height="20" rx="4" fill="#D4AF37" stroke="#8A6112" stroke-width="1.5" />
  </g>

  <!-- Auspicious Mango Leaf & Marigold Thoranam Across Top Arch -->
  <path d="M54 68 Q400 105 746 68" stroke="#9A721C" stroke-width="3" fill="none" />
  <g>
    <!-- Mango Leaves along the top garland -->
    <path d="M110 74 C104 96, 116 112, 118 118 C122 112, 130 96, 124 75 Z" fill="#3B7A4C" />
    <path d="M170 79 C164 101, 176 117, 178 123 C182 117, 190 101, 184 80 Z" fill="#2E6B40" />
    <path d="M230 83 C224 105, 236 121, 238 127 C242 121, 250 105, 244 84 Z" fill="#3B7A4C" />
    <path d="M290 86 C284 108, 296 124, 298 130 C302 124, 310 108, 304 87 Z" fill="#2E6B40" />
    <path d="M350 88 C344 110, 356 126, 358 132 C362 126, 370 110, 364 89 Z" fill="#3B7A4C" />
    <path d="M400 89 C394 111, 406 127, 408 133 C412 127, 420 111, 414 89 Z" fill="#2E6B40" />
    <path d="M450 88 C444 110, 456 126, 458 132 C462 126, 470 110, 464 89 Z" fill="#3B7A4C" />
    <path d="M510 86 C504 108, 516 124, 518 130 C522 124, 530 108, 524 87 Z" fill="#2E6B40" />
    <path d="M570 83 C564 105, 576 121, 578 127 C582 121, 590 105, 584 84 Z" fill="#3B7A4C" />
    <path d="M630 79 C624 101, 636 117, 638 123 C642 117, 650 101, 644 80 Z" fill="#2E6B40" />
    <path d="M690 74 C684 96, 696 112, 698 118 C702 112, 710 96, 704 75 Z" fill="#3B7A4C" />

    <!-- Marigold & Lotus Blossoms along the garland -->
    <circle cx="117" cy="74" r="9" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
    <circle cx="177" cy="79" r="9" fill="#EC407A" stroke="#AD1457" stroke-width="1.5" />
    <circle cx="237" cy="83" r="9" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
    <circle cx="297" cy="86" r="9" fill="#EC407A" stroke="#AD1457" stroke-width="1.5" />
    <circle cx="357" cy="88" r="9" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
    <circle cx="407" cy="89" r="11" fill="#D81B60" stroke="#F3DFA2" stroke-width="2" />
    <circle cx="457" cy="88" r="9" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
    <circle cx="517" cy="86" r="9" fill="#EC407A" stroke="#AD1457" stroke-width="1.5" />
    <circle cx="577" cy="83" r="9" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
    <circle cx="637" cy="79" r="9" fill="#EC407A" stroke="#AD1457" stroke-width="1.5" />
    <circle cx="697" cy="74" r="9" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
  </g>

  <!-- Floor Rangoli / Kolam Carpet -->
  <ellipse cx="400" cy="488" rx="310" ry="24" fill="#E8D2A0" stroke="#C59B27" stroke-width="1.5" />
  <ellipse cx="400" cy="488" rx="220" ry="15" fill="#7A1C1C" fill-opacity="0.12" stroke="#7A1C1C" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ============================================================ -->
  <!-- 1. ELDER DAUGHTER (Left - সেল्वी / மூத்த மகள் in Silk Dhavani) -->
  <!-- ============================================================ -->
  <g transform="translate(155, 168)">
    <!-- Long braided hair with jasmine malligai garland -->
    <path d="M35 38 C16 45, 14 82, 24 115 C36 122, 68 122, 78 110 C86 80, 84 45, 65 38 Z" fill="#1E1410" />
    <!-- Jasmine flowers around hair bun -->
    <path d="M26 42 Q50 30 74 42" stroke="#FFFDF9" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 5" />
    <!-- Neck -->
    <rect x="42" y="74" width="16" height="18" rx="6" fill="url(#skinTone)" />
    <!-- Face -->
    <ellipse cx="50" cy="52" rx="21" ry="25" fill="url(#skinTone)" />
    <!-- Eyes, Eyebrows, Smile & Kungumam Pottu -->
    <path d="M37 46 Q42 42 46 46" stroke="#23120B" stroke-width="1.8" stroke-linecap="round" />
    <path d="M54 46 Q58 42 63 46" stroke="#23120B" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="42" cy="50" r="2.2" fill="#1E1410" />
    <circle cx="58" cy="50" r="2.2" fill="#1E1410" />
    <circle cx="50" cy="41" r="2.5" fill="#9E1B1B" />
    <path d="M44 63 Q50 68 56 63" stroke="#8C2D19" stroke-width="2" stroke-linecap="round" />
