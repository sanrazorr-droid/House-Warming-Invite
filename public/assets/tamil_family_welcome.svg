    <rect x="58" y="138" width="7" height="11" rx="2" transform="rotate(20 58 138)" fill="#D4AF37" />
  </g>

  <!-- ============================================================ -->
  <!-- 4. YOUNGER SON (Right - இளைய மகன் in Silk Shirt & Pattu Veshti) -->
  <!-- ============================================================ -->
  <g transform="translate(550, 206)">
    <!-- Hair -->
    <path d="M26 32 C24 12, 68 12, 66 32 C62 24, 30 24, 26 32 Z" fill="#1E1410" />
    <!-- Neck -->
    <rect x="39" y="64" width="14" height="14" rx="5" fill="url(#skinTone)" />
    <!-- Face -->
    <ellipse cx="46" cy="44" rx="19" ry="22" fill="url(#skinTone)" />
    <!-- Vibhuthi & Kumkum -->
    <line x1="39" y1="32" x2="53" y2="32" stroke="#FFFDF8" stroke-width="2" stroke-linecap="round" />
    <circle cx="46" cy="34" r="2" fill="#9E1B1B" />
    <!-- Eyes & Cheerful Smile -->
    <path d="M35 40 Q39 37 43 40" stroke="#1E1410" stroke-width="1.6" stroke-linecap="round" />
    <path d="M49 40 Q53 37 57 40" stroke="#1E1410" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="39" cy="44" r="2" fill="#1E1410" />
    <circle cx="53" cy="44" r="2" fill="#1E1410" />
    <path d="M40 54 Q46 59 52 54" stroke="#7A2818" stroke-width="2" stroke-linecap="round" />

