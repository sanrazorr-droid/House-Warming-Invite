    <rect x="58" y="136" width="6" height="10" rx="2" transform="rotate(20 58 136)" fill="#D4AF37" />
  </g>

  <!-- ============================================================ -->
  <!-- 2. FATHER (Center-Left - தந்தை in Pattu Veshti & Angavastram) -->
  <!-- ============================================================ -->
