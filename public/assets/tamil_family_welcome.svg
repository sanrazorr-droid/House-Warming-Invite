    <path d="M22 58 L32 58 L30 66 L24 66 Z" fill="#B3861B" />
    <circle cx="73" cy="54" r="4.5" fill="#D4AF37" />
    <path d="M68 58 L78 58 L76 66 L70 66 Z" fill="#B3861B" />

    <!-- Kanjeevaram Maroon & Gold Silk Saree -->
    <path d="M14 92 C26 82, 74 82, 86 92 L96 336 L4 336 Z" fill="url(#maroonSilk)" stroke="#D4AF37" stroke-width="2.5" />
    <!-- Broad Golden Zari Saree Pallu & Borders -->
    <path d="M20 90 L84 165 L18 255 L10 140 Z" fill="url(#goldFrame)" fill-opacity="0.9" stroke="#9A721C" stroke-width="1.5" />
    <rect x="4" y="308" width="92" height="28" fill="url(#goldFrame)" />
    <!-- Traditional Mangalsutra (Thali) & Temple Haram Jewelry -->
    <path d="M35 88 Q50 108 65 88" stroke="#F7E4A3" stroke-width="4.5" stroke-linecap="round" />
    <path d="M31 92 Q50 122 69 92" stroke="#D4AF37" stroke-width="3.5" stroke-dasharray="4 3" />

    <!-- Folded Hands in Vanakkam -->
    <path d="M16 106 C8 136, 26 154, 46 146" stroke="url(#skinTone)" stroke-width="11.5" stroke-linecap="round" fill="none" />
    <path d="M84 106 C92 136, 74 154, 54 146" stroke="url(#skinTone)" stroke-width="11.5" stroke-linecap="round" fill="none" />
    <path d="M50 120 C42 128, 42 148, 50 152 C58 148, 58 128, 50 120 Z" fill="url(#skinTone)" stroke="#B57347" stroke-width="1" />
    <!-- Gold & Red Bangles -->
